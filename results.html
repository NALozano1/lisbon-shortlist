<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Results · Lisbon shortlist</title>
  <meta name="description" content="See which Lisbon shortlist homes can cover a 40-year mortgage with short-let income." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-results">
  <header class="site-header">
    <div class="brand">
      <h1>
        <span class="full">Lisbon shortlist · Results</span>
        <span class="short">Results</span>
      </h1>
      <p>Can short-let cover the mortgage? <span id="results-asof"></span></p>
    </div>
    <nav class="nav" aria-label="Primary">
      <a href="index.html">Shortlist</a>
      <a href="pipeline.html">Pipeline</a>
      <a href="roi.html">ROI</a>
      <a class="active" href="results.html">Results</a>
    </nav>
  </header>

  <main class="results-wrap">
    <div class="results-banner" role="status">
      <p class="method-note" id="method-note">Illustrative · 40y loan · not tax advice.</p>
    </div>

    <div class="toolbar results-toolbar">
      <div class="chip-row readiness-row" id="readiness-filters" role="group" aria-label="Readiness">
        <button type="button" class="chip active" data-readiness="ready">Ready only</button>
        <button type="button" class="chip" data-readiness="all">Show obras</button>
      </div>
      <div class="chip-row" id="filters" role="group" aria-label="Filters">
        <button type="button" class="chip active" data-filter="all">All</button>
        <button type="button" class="chip" data-filter="170k">≤€170k</button>
        <button type="button" class="chip" data-filter="al">AL only</button>
      </div>
      <label class="sort-label">
        Sort
        <select class="sort-select" id="sort" aria-label="Sort results">
          <option value="str_mid_coverage" selected>Best short-let cover</option>
          <option value="price">Cheapest</option>
          <option value="ltr_coverage">Best long-let cover</option>
        </select>
      </label>
    </div>

    <p class="results-count" id="results-count" aria-live="polite"></p>
    <div id="results-list" class="results-list"></div>
  </main>

  <footer class="site-footer">
    For Alex Lozano · illustrative figures from <code>data/roi-results.json</code>.
  </footer>

  <script src="results.js"></script>
</body>
</html>
